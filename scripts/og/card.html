<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f6efd9; --paper-dot: #ebe1c2; --box: #fffdf6; --ink: #2a2230; --ink-2: #554a5e;
    --red: #b8324a; --blue: #2a56a8; --green: #2c7438; --shell: #d9d4cb; --shell-dark: #b9b3a8; --bezel: #4f4a5e;
    --px: "Press Start 2P", monospace; --body: "DotGothic16", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    color: var(--ink); font-family: var(--body);
    background-color: var(--paper);
    background-image: radial-gradient(var(--paper-dot) 2px, transparent 2.2px);
    background-size: 20px 20px;
    display: flex; align-items: center; gap: 44px; padding: 0 52px;
  }
  .shell {
    flex: none; background: var(--shell); border: 4px solid var(--ink); border-radius: 16px 16px 48px 16px;
    padding: 28px 28px 36px; box-shadow: 8px 8px 0 var(--shell-dark);
  }
  .bezel { background: var(--bezel); border-radius: 8px 8px 24px 8px; padding: 20px 28px 16px; }
  .bezel p { font: 10px/1 var(--px); color: #c9c3d6; text-align: center; margin-top: 12px; letter-spacing: .1em; }
  canvas { display: block; width: 400px; height: 360px; image-rendering: pixelated; border: 4px solid var(--ink); }
  .copy { display: grid; gap: 26px; min-width: 0; }
  .tag { font: 16px/1 var(--px); color: var(--red); display: flex; align-items: center; gap: 14px; }
  .tag::before { content: ""; width: 16px; height: 16px; background: var(--red); clip-path: polygon(0 0, 100% 50%, 0 100%); }
  h1 { font: 46px/1.3 var(--px); }
  .headline { font-size: 38px; line-height: 1.3; }
  .headline span { display: block; }
  .box {
    justify-self: start; background: var(--box); border: 4px solid var(--ink); outline: 4px solid var(--box);
    box-shadow: 0 0 0 8px var(--ink); margin: 8px; padding: 12px 18px; font-size: 21px; color: var(--green); white-space: nowrap;
  }
  .url { font: 18px/1 var(--px); color: var(--blue); }
</style>
</head>
<body>
  <div class="shell">
    <div class="bezel">
      <canvas id="room"></canvas>
      <p>PRESS START</p>
    </div>
  </div>
  <div class="copy">
    <div class="tag">HIRE ME</div>
    <h1 id="name"></h1>
    <p class="headline" id="headline"></p>
    <p class="box">● <span id="status"></span></p>
    <p class="url">hirenikema.app</p>
  </div>
  <script src="./scene.js"></script>
</body>
</html>
